name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: mediflowdb_test
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=5

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
            backend/package-lock.json

      - name: Install MySQL client and configure auth
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq mysql-client
          mysql --host=127.0.0.1 --port=3306 -uroot -proot -e "
            ALTER USER 'root'@'%' IDENTIFIED WITH mysql_native_password BY 'root';
            FLUSH PRIVILEGES;
          " 2>&1

      - name: Set SECRET_KEY for CI
        run: echo "SECRET_KEY=${SECRET_KEY:-mediflow-ci-default-secret-key-not-for-production}" >> $GITHUB_ENV
        env:
          SECRET_KEY: ${{ secrets.SECRET_KEY }}

      - name: Install dependencies
        run: npm run install:all

      - name: Lint backend
        run: npm run lint
        working-directory: backend

      - name: Lint frontend
        run: npm run lint
        working-directory: frontend

      - name: Frontend build
        run: npm run build
        working-directory: frontend

      - name: Frontend tests
        run: npm test -- --coverage
        working-directory: frontend

      - name: Backend tests
        run: npm test -- --coverage
        working-directory: backend
        env:
          DB_HOST: localhost
          DB_USER: root
          DB_PASSWORD: root
          JWT_EXPIRATION: 1h
