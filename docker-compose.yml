services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_NAME:-mediflowdb}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mediflow-net

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      PORT: 5000
      CORS_ORIGINS: http://localhost:5173,http://localhost
      DB_HOST: db
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD:-root}
      DB_NAME: ${DB_NAME:-mediflowdb}
      DATABASE_URL: mysql://root:${DB_PASSWORD:-root}@db:3306/${DB_NAME:-mediflowdb}
      SECRET_KEY: ${SECRET_KEY}
      JWT_EXPIRATION: 1h
    ports:
      - "5000:5000"
    volumes:
      - uploads_data:/app/uploads
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      db:
        condition: service_healthy
    networks:
      - mediflow-net

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - mediflow-net

volumes:
  db_data:
  uploads_data:

networks:
  mediflow-net:
    driver: bridge
